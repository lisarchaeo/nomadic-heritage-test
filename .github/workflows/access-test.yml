name: Figshare access test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check what GitHub's servers can reach
        run: |
          S=$GITHUB_STEP_SUMMARY
          UA="NomadicMaterialHeritage-site-test (GitHub Actions)"

          check() {
            code=$(curl -s -L -o /tmp/out -w "%{http_code}" -A "$UA" $3 "$2")
            size=$(wc -c < /tmp/out)
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then r="✅ worked"; else r="❌ failed"; fi
            echo "| $1 | $r | $code | $size bytes |" >> $S
          }

          echo "## Figshare access test" >> $S
          echo "" >> $S
          echo "| Test | Result | Code | Received |" >> $S
          echo "|---|---|---|---|" >> $S
          check "API: Work in progress in a yurt" "https://api.figshare.com/v2/articles/32075862"
          check "API: Terme (detail)" "https://api.figshare.com/v2/articles/32075880"
          check "API: whole project item list" "https://api.figshare.com/v2/projects/274269/articles?page_size=1000"
          check "Thumbnail image" "https://s3-eu-west-1.amazonaws.com/ppreviews-britishmuseum-4173880823/63927525/thumb.png"
          check "Original file (first 1 KB only)" "https://ndownloader.figshare.com/files/63927525" "-r 0-1023"
          check "Repository web page (may fail; not needed)" "https://drs.britishmuseum.org/articles/figure/Work_in_progress_in_a_yurt/32075862"

          echo "" >> $S
          echo "### What the project list contains" >> $S
          curl -s -A "$UA" "https://api.figshare.com/v2/projects/274269/articles?page_size=1000" -o /tmp/list.json
          python3 - >> $S << 'PY'
          import json, collections
          try:
              items = json.load(open('/tmp/list.json'))
              print(f"- Items returned: {len(items)} (if this is exactly 1000, there are more pages)")
              kinds = collections.Counter(i.get('defined_type_name', 'unknown') for i in items)
              for k, n in kinds.most_common():
                  print(f"- {k}: {n}")
              print("")
              print("First five titles:")
              for i in items[:5]:
                  print(f"- {i.get('title')} (id {i.get('id')})")
          except Exception as e:
              print(f"- Could not read the list: {e}")
          PY
